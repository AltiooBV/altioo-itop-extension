name: Bug report
description: Something the extension does that it should not, or does not do that it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >-
        **Not for vulnerabilities.** A suspected security issue goes to
        [the private advisory form](https://github.com/{{GITHUB_ORG}}/{{MODULE_CODE}}/security/advisories/new)
        or <{{SECURITY_EMAIL}}>, never here.


        Most of what follows is diagnosed from one file, `<itop>/log/error.log`. Worth a look
        before this form, and the README's Troubleshooting section (if one exists) may already
        name the case.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: >-
        Redact anything you would not publish - a token, a password, and object contents that
        carry personal data.
    validations:
      required: true

  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: The one in `extension.xml`, or the setup's module list.
      placeholder: 1.0.0
    validations:
      required: true

  - type: input
    id: itop-version
    attributes:
      label: iTop version
      description: The full version, patch included, as the console footer or `setup/` reports it.
      placeholder: 3.2.2-1-17851
    validations:
      required: true

  - type: dropdown
    id: php-version
    attributes:
      label: PHP version
      options:
        - "8.2"
        - "8.3"
        - "8.4"
        - Other (say which below)
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: >-
        From `<itop>/log/error.log`, which is where every refusal whose reason is deliberately
        kept out of a response is written.
      render: text

  - type: textarea
    id: config
    attributes:
      label: Relevant module parameters
      description: >-
        This module's block from `conf/production/config-itop.php`, with any value you would
        rather not publish replaced by a description of it.
      render: php

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: >-
            This is not a security report, and nothing above is a credential.
          required: true
        - label: >-
            I checked whether the user reproducing this can do the same thing through the iTop
            console. A refusal the console also gives is iTop's permission model working.
          required: false
